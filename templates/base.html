<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Collegiate Esports Hub{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <img class = "landing-image" src="{{ url_for('static', filename='Hero.jpg') }}" alt="Hero Image">
<div class="landing">
    <div class="landing-overlay"></div>

    <div class = "landing-copy">
    <!-- Site Header -->
    <header class="landing-nav">
        <a class="hub-brand" href="{{ url_for('home') }}">
            <span class="hub-mark">C</span>
            <div>
                <strong>COLLEGIATE</strong>
                <small>ESPORTS HUB</small>
            </div>
        </a>
        <div class="landing-nav-actions">
            <a class="landing-link" href="{{ url_for('join') }}">For programs</a>
            <a class="button button-secondary" href="#">Member sign in</a>
        </div>
    </header>
    <!-- End of Site Header -->

    <!-- Main Content -->
    <main>
    {% block content %}
    <!-- Child templates override this section -->
    {% endblock %}
    </main>
    <!-- End of Main Content -->

    <!-- Site Footer -->
    <footer class="landing-footer">
        <div class="hub-brand">
            <span class="hub-mark">C</span>
            <div>
                <strong>COLLEGIATE</strong>
                <small>ESPORTS HUB</small>
            </div>
        </div>
        <span>&copy; 2026 Collegiate Esports Hub. All rights reserved.</span>
    </footer>
    <!-- End of Site Footer -->

</div>
</body>
</html>
