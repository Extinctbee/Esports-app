<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Collegiate Esports Hub{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="landing">

    <!-- Site Header -->
    <header class="landing-nav">
        <a class="hub-brand" href="{{ url_for('home') }}">
            <span class="hub-mark">C</span>
            <div>
                <strong>COLLEGIATE</strong>
                <small>ESPORTS HUB</small>
            </div>
        </a>
        <div class="landing-nav-actions">
            <a class="landing-link" href="{{ url_for('join') }}">For programs</a>

            {% if g.user %}
                <!-- Logged-in account -->
                <span class="landing-link">
                    <a href="{{ url_for('university', uID = g.userRoles[0].uID) }}#profile" >{{g.user.auFirstName}}</a>
                </span>

                <form action="{{ url_for('logout') }}" method="POST">
                    <button class="button button-secondary" type="submit">
                        Logout
                    </button>
                </form>

            {% else %}
                <!-- Guest account -->
                <a class="button button-secondary" href="{{ url_for('login') }}">
                    Member sign in
                </a>
            {% endif %}
        </div>
    </header>
    <!-- End of Site Header -->

    <!-- Main Content -->
    <main>
    {% block content %}
    <!-- Child templates override this section -->
    {% endblock %}
    </main>
    <!-- End of Main Content -->

    <!-- Site Footer -->
    <footer class="landing-footer">
        <div class="hub-brand">
            <span class="hub-mark">C</span>
            <div>
                <strong>COLLEGIATE</strong>
                <small>ESPORTS HUB</small>
            </div>
        </div>
        <span>&copy; 2026 Collegiate Esports Hub. All rights reserved.</span>
    </footer>
    <!-- End of Site Footer -->

</div>
</body>
</html>
