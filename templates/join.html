
{% extends "base.html" %}

{% block title %}Join - University Profile Request{% endblock %}

{% block content %}
<div class="page-content">
    <div class="eyebrow">For programs</div>
    <h1>Request a University Profile</h1>
    <p>Send your information to our development team to request a university profile for verification.</p>

    <form method="post" class="form">
        <label>
            <span>First name</span>
            <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
        </label>
        <label>
            <span>Last name</span>
            <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
        </label>
        <label>
            <span>Email address</span>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </label>
        <label>
            <span>University name</span>
            <input type="text" id="university_name" name="university_name" autocomplete="organization" required>
        </label>
        <label>
            <span>University state</span>
            <input type="text" id="university_state" name="university_state" autocomplete="address-level1" required>
        </label>
        <label>
            <span>University city</span>
            <input type="text" id="university_city" name="university_city" autocomplete="address-level2" required>
        </label>

        <div><button type="submit" class="button button-primary">Submit request</button></div>
    </form>
</div>
{% endblock %}
